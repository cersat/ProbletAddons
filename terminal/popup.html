<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
	body { margin: 0; width: 520px; padding: 12px 14px; background: #16161d; color: #e8e8f0; font: 13px/1.4 system-ui, sans-serif; }
	form { display: flex; gap: 8px; }
	input { flex: 1; min-width: 0; padding: 8px; border: 1px solid #3a3a50; border-radius: 8px; background: #101016; color: #e8e8f0; font: 13px ui-monospace, monospace; }
	button { padding: 8px 12px; border: 1px solid #a6b4ff; border-radius: 8px; background: #a6b4ff; color: #16161d; font: 600 13px system-ui, sans-serif; cursor: pointer; }
	button:disabled { opacity: .6; cursor: default; }
	pre { margin: 10px 0 0; min-height: 60px; max-height: 360px; overflow: auto; padding: 8px 10px; border-radius: 8px; background: #101016; font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; word-break: break-all; }
	.err { color: #f2929a; }
	.meta { margin-top: 6px; color: #9a9ab0; font-size: 12px; }
</style>
</head>
<body>
	<form id="f"><input id="cmd" placeholder="Команда, например: ls -la" autocomplete="off" spellcheck="false" autofocus><button id="go">Выполнить</button></form>
	<pre id="out"></pre>
	<div class="meta" id="meta">↑ ↓ — прошлые команды</div>
	<script src="popup.js"></script>
</body>
</html>
