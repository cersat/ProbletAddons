<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
	body { margin: 0; width: 280px; padding: 14px 16px; background: #1c1c25; color: #e8e8f0; font: 14px/1.4 system-ui, sans-serif; }
	h1 { margin: 0 0 4px; font-size: 15px; }
	p { margin: 0 0 12px; color: #9a9ab0; font-size: 13px; word-break: break-all; }
	button { width: 100%; padding: 9px; border: 1px solid #3a3a50; border-radius: 8px; background: #2a2a38; color: #e8e8f0; font: inherit; cursor: pointer; }
	button.on { background: #a6b4ff; border-color: #a6b4ff; color: #16161d; font-weight: 600; }
	.list { margin-top: 12px; color: #9a9ab0; font-size: 12px; }
</style>
</head>
<body>
	<h1>Тёмная тема</h1>
	<p id="host">…</p>
	<button id="toggle" disabled>Включить для этого сайта</button>
	<div class="list" id="count"></div>
	<script src="popup.js"></script>
</body>
</html>
