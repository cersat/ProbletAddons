<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
	body { margin: 0; width: 460px; padding: 14px 16px; background: #1c1c25; color: #e8e8f0; font: 14px/1.4 system-ui, sans-serif; }
	h1 { margin: 0 0 10px; font-size: 15px; }
	.tabs { display: flex; gap: 6px; margin-bottom: 8px; }
	button { padding: 7px 10px; border: 1px solid #3a3a50; border-radius: 8px; background: #2a2a38; color: #e8e8f0; font: inherit; cursor: pointer; }
	button.on { background: #3a3a58; border-color: #a6b4ff; }
	button.primary { background: #a6b4ff; border-color: #a6b4ff; color: #16161d; font-weight: 600; }
	button:disabled { opacity: .5; cursor: default; }
	label.small { display: flex; gap: 6px; align-items: center; color: #9a9ab0; font-size: 13px; margin-bottom: 8px; }
	ul { list-style: none; margin: 0; padding: 0; max-height: 330px; overflow-y: auto; border-top: 1px solid #2e2e3e; }
	li { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid #2e2e3e; }
	li .th { width: 56px; height: 44px; flex: none; border-radius: 6px; background: #16161d center / cover no-repeat; display: grid; place-items: center; color: #9a9ab0; font-size: 18px; overflow: hidden; }
	li .th img, li .th video { width: 100%; height: 100%; object-fit: cover; }
	li .what { flex: 1; min-width: 0; }
	li b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
	li small { color: #9a9ab0; }
	.foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
	.foot .st { flex: 1; color: #9a9ab0; font-size: 13px; min-width: 0; }
	.empty { color: #9a9ab0; padding: 14px 0; }
</style>
</head>
<body>
	<h1 id="h"></h1>
	<div class="tabs"><button id="t-img"></button><button id="t-vid"></button><button id="all"></button></div>
	<label class="small"><input type="checkbox" id="small"> <span id="small-l"></span></label>
	<ul id="list"></ul>
	<div class="foot"><span class="st" id="st"></span><button class="primary" id="go"></button></div>
	<script src="popup.js"></script>
</body>
</html>
